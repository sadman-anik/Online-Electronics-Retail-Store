<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Create Tablet</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">Create a New Tablet</h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>

    <h:form>

        <h:panelGrid columns="2" cellpadding="8">

            <h:outputLabel value="Brand"/>
            <h:inputText value="#{productController.tablet.brand}" required="true"
                         requiredMessage="Brand is required."/>

            <h:outputLabel value="Model"/>
            <h:inputText value="#{productController.tablet.model}" required="true"
                         requiredMessage="Model is required."/>

            <h:outputLabel value="Display Size"/>
            <h:inputText value="#{productController.tablet.displaySize}" required="true"
                         requiredMessage="Display size is required."/>

            <h:outputLabel value="Weight"/>
            <h:inputText value="#{productController.tablet.weight}" required="true"
                         requiredMessage="Weight is required."/>

            <h:outputLabel value="Operating System"/>
            <h:inputText value="#{productController.tablet.operatingSystem}" required="true"
                         requiredMessage="Operating system is required."/>

            <h:outputLabel value="Connectivity"/>
            <h:inputText value="#{productController.tablet.connectivity}" required="true"
                         requiredMessage="Connectivity is required."/>

            <h:outputLabel value="Wi-Fi Capable"/>
            <h:selectBooleanCheckbox value="#{productController.tablet.wifiCapable}"/>

            <h:outputLabel value="Price"/>
            <h:inputText value="#{productController.tablet.price}" required="true"
                         requiredMessage="Price is required."/>

            <h:outputLabel value="Stock Number"/>
            <h:inputText value="#{productController.tablet.stockNumber}" required="true"
                         requiredMessage="Stock number is required."/>

            <h:outputLabel value="Storage Capacity"/>
            <h:inputText value="#{productController.tablet.storageCapacity}" required="true"
                         requiredMessage="Storage capacity is required."/>

            <h:outputLabel value="Stylus Support"/>
            <h:selectBooleanCheckbox value="#{productController.tablet.stylusSupport}"/>

            <h:outputLabel value="Battery Capacity"/>
            <h:inputText value="#{productController.tablet.batteryCapacity}" required="true"
                         requiredMessage="Battery capacity is required."/>

            <h:outputLabel value="Description"/>
            <h:inputTextarea value="#{productController.tablet.description}" rows="4"/>

        </h:panelGrid>

        <br/>

        <h:commandButton value="Create Tablet"
                         action="#{productController.doCreateTablet}"/>

    </h:form>

    <div class="nav-links">
        <h:link outcome="/product/listTablets.xhtml" value="View Tablet Stock"/> |
        <h:link outcome="/default.xhtml" value="Back to Dashboard"/>
    </div>

</div>

</h:body>
</html>
