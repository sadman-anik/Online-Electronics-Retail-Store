<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head>
    <h:outputStylesheet library="css" name="style.css" />
    <title>New Tablet</title>
</h:head>
<h:body>
    <div class="page-container">
        <h1 class="page-header">Create a New Tablet</h1>
        <div class="message">
            <h:messages globalOnly="false" />
        </div>

        <h:form>
            <h:panelGrid columns="2">
                <h:outputLabel value="Brand" />
                <h:inputText value="#{productController.tablet.brand}" />
                <h:outputLabel value="Model" />
                <h:inputText value="#{productController.tablet.model}" />
                <h:outputLabel value="Display Size" />
                <h:inputText value="#{productController.tablet.displaySize}" />
                <h:outputLabel value="Weight" />
                <h:inputText value="#{productController.tablet.weight}" />
                <h:outputLabel value="Operating System" />
                <h:inputText value="#{productController.tablet.operatingSystem}" />
                <h:outputLabel value="Connectivity" />
                <h:inputText value="#{productController.tablet.connectivity}" />
                <h:outputLabel value="Wi-Fi Capable" />
                <h:selectBooleanCheckbox value="#{productController.tablet.wifiCapable}" />
                <h:outputLabel value="Price" />
                <h:inputText value="#{productController.tablet.price}" />
                <h:outputLabel value="Stock Number" />
                <h:inputText value="#{productController.tablet.stockNumber}" />
                <h:outputLabel value="Storage Capacity" />
                <h:inputText value="#{productController.tablet.storageCapacity}" />
                <h:outputLabel value="Stylus Support" />
                <h:selectBooleanCheckbox value="#{productController.tablet.stylusSupport}" />
                <h:outputLabel value="Battery Capacity" />
                <h:inputText value="#{productController.tablet.batteryCapacity}" />
                <h:outputLabel value="Description" />
                <h:inputTextarea value="#{productController.tablet.description}" />
            </h:panelGrid>
            <h:commandButton value="Create a tablet" action="#{productController.doCreateTablet}" />
        </h:form>
        <h:link outcome="listTablets.xhtml" value="The Stock of Tablets" />

        <div class="nav-links">
            <h:link outcome="/default.xhtml" value="Back to Dashboard" /> |
            <h:form rendered="#{authBean.logged}" style="display:inline;">
                <h:commandLink value="Logout" action="#{authBean.logout}" styleClass="logout-btn" />
            </h:form>
        </div>
    </div>
</h:body>

</html>
