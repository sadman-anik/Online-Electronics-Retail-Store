<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <h:outputStylesheet library="css" name="style.css"/><title>Found Tablets</title></h:head>
<h:body>
<div class="page-container">
<h1 class="page-header">The Found Tablets</h1>
<div class="message"><h:messages globalOnly="false"/></div>

<h:dataTable value="#{productController.tabletList}" var="t" border="1">
<h:column><f:facet name="header">ID</f:facet>#{t.id}</h:column>
<h:column><f:facet name="header">Brand</f:facet>#{t.brand}</h:column>
<h:column><f:facet name="header">Model</f:facet>#{t.model}</h:column>
<h:column><f:facet name="header">Display Size</f:facet>#{t.displaySize}</h:column>
<h:column><f:facet name="header">OS</f:facet>#{t.operatingSystem}</h:column>
<h:column><f:facet name="header">Price</f:facet>#{t.price}</h:column>
<h:column><f:facet name="header">Stock</f:facet>#{t.stockNumber}</h:column>
<h:column><f:facet name="header">Storage</f:facet>#{t.storageCapacity}</h:column>
<h:column><f:facet name="header">Stylus</f:facet>#{t.stylusSupport}</h:column>
</h:dataTable>

<div class="nav-links">
<h:link outcome="/default.xhtml" value="Main Page"/> |
<h:commandLink value="Logout" action="#{authBean.logout}" rendered="#{authBean.logged}"/>
</div>
</div>
</h:body>
</html>
