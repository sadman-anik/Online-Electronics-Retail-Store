<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head>
    <h:outputStylesheet library="css" name="style.css" />
    <title>Customer Details</title>
</h:head>
<h:body>
    <div class="page-container">
        <h1 class="page-header">Customer Details</h1>
        <div class="message">
            <h:messages globalOnly="false" />
        </div>

        <f:metadata>
            <f:viewParam name="customerId" value="#{customerController.selectedCustomerId}" />
        </f:metadata>
        <h:panelGrid columns="2" rendered="#{customerController.selectedCustomer != null}">
            <h:outputText value="ID:" />
            <h:outputText value="#{customerController.selectedCustomer.id}" />
            <h:outputText value="Name:" />
            <h:outputText value="#{customerController.selectedCustomer.name}" />
            <h:outputText value="Address:" />
            <h:outputText value="#{customerController.selectedCustomer.address}" />
            <h:outputText value="Email:" />
            <h:outputText value="#{customerController.selectedCustomer.emailAddress}" />
        </h:panelGrid>
        <h2>Orders</h2>
        <h:dataTable value="#{customerController.selectedCustomer.orders}" var="o" border="1">
            <h:column>
                <f:facet name="header">Order #</f:facet>#{o.id}
            </h:column>
            <h:column>
                <f:facet name="header">Time Created</f:facet>#{o.createdAt}
            </h:column>
            <h:column>
                <f:facet name="header">Brand/Model</f:facet>#{o.product.brandModel}
            </h:column>
            <h:column>
                <f:facet name="header">Unit Price</f:facet>#{o.unitPrice}
            </h:column>
            <h:column>
                <f:facet name="header">Qty</f:facet>#{o.quantity}
            </h:column>
            <h:column>
                <f:facet name="header">Total Price</f:facet>#{o.totalPrice}
            </h:column>
        </h:dataTable>
        <h:link outcome="listCustomers.xhtml" value="Customer List" /> |
        <h:link outcome="/order/listOrders.xhtml" value="Order List" />

        <div class="nav-links">
            <h:link outcome="/default.xhtml" value="Back to Dashboard" /> |
            <h:form rendered="#{authBean.logged}" style="display:inline;">
                <h:commandLink value="Logout" action="#{authBean.logout}" styleClass="logout-btn" />
            </h:form>
        </div>
    </div>
</h:body>

</html>
