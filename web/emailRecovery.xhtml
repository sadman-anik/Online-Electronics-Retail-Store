<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Password Recovery</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">
        Recovery from Your Email
    </h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>

    <h:form>

        <h:panelGrid columns="2" cellpadding="8">

            <h:outputLabel value="Email Address" styleClass="required-label"/>

            <h:inputText value="#{authBean.email}"
                         required="true"
                         requiredMessage="Email address is required."
                         validatorMessage="Please enter a valid email address.">
                <f:validateRegex
                    pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$"/>
            </h:inputText>

        </h:panelGrid>

        <br/>

        <h:commandButton value="Recover Password"
                 action="#{authBean.createRecoveryCode}"/>

    </h:form>

    <br/>

    <div class="nav-links">

        <h:link outcome="/login.xhtml"
                value="Back to Login"/>

    </div>

</div>

</h:body>
</html>
