<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Search Order</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">
        Search for an Order
    </h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>

    <h:form>

        <h:panelGrid columns="2" cellpadding="8">

            <h:outputLabel value="Order Number" styleClass="required-label"/>

            <h:inputText value="#{orderController.searchOrderId}"
                         required="true"
                         requiredMessage="Order number is required."/>

        </h:panelGrid>

        <br/>

        <h:commandButton value="Search Order"
                         action="#{orderController.doSearchOrder}"/>

    </h:form>

    <br/>

    <h:link outcome="listOrders.xhtml"
            value="View Orders"/>

    <div class="nav-links">

        <h:link outcome="/default.xhtml"
                value="Back to Dashboard"/>

        |

        <h:form rendered="#{authBean.logged}"
                style="display:inline;">

            <h:commandLink value="Logout"
                           action="#{authBean.logout}"
                           styleClass="logout-btn"/>

        </h:form>

    </div>

</div>

</h:body>
</html>
