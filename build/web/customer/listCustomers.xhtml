<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>List Customers</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">
        List of Customers
    </h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>
    
    <h:form>

        <h:panelGrid columns="3" cellpadding="6">

            <h:outputLabel value="Search"/>

            <h:inputText value="#{customerController.searchName}"/>
            <h:commandButton value="Search"
                     action="#{customerController.doSearchCustomer}"/>

        </h:panelGrid>

    </h:form>

    <h:form>

        <h:dataTable value="#{customerController.customerList}"
                     var="c"
                     border="1"
                     styleClass="table">

            <h:column>
                <f:facet name="header">ID</f:facet>
                #{c.id}
            </h:column>

            <h:column>
                <f:facet name="header">Name</f:facet>
                #{c.name}
            </h:column>

            <h:column>
                <f:facet name="header">Address</f:facet>
                #{c.address}
            </h:column>

            <h:column>
                <f:facet name="header">Orders</f:facet>
                #{c.orders.size()}
            </h:column>

            <h:column>
                <f:facet name="header">Action</f:facet>

                <h:link outcome="/customer/searchCustomer.xhtml"
                        value="View"/>

            </h:column>

        </h:dataTable>

    </h:form>

    <br/>

    <h:link outcome="/customer/newCustomer.xhtml"
            value="Create New Customer"/>

    <div class="nav-links">

        <h:link outcome="/default.xhtml"
                value="Back to Dashboard"/>

        |

        <h:form rendered="#{authBean.logged}"
                style="display:inline;">

            <h:commandLink value="Logout"
                           action="#{authBean.logout}"
                           styleClass="logout-btn"/>

        </h:form>

    </div>

</div>

</h:body>
</html>
