<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Found Order</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">
        Found Order
    </h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>

    <h:dataTable value="#{[orderController.foundOrder]}"
                 var="o"
                 border="1"
                 style="width:100%;">

        <h:column>
            <f:facet name="header">Order #</f:facet>
            #{o.id}
        </h:column>

        <h:column>
            <f:facet name="header">Customer</f:facet>
            #{o.customer.name}
        </h:column>

        <h:column>
            <f:facet name="header">Device</f:facet>
            #{o.product.brandModel}
        </h:column>

        <h:column>
            <f:facet name="header">Created At</f:facet>
            #{o.createdAt}
        </h:column>

        <h:column>
            <f:facet name="header">Unit Price</f:facet>
            $#{o.unitPrice}
        </h:column>

        <h:column>
            <f:facet name="header">Quantity</f:facet>
            #{o.quantity}
        </h:column>

        <h:column>
            <f:facet name="header">Total Price</f:facet>
            $#{o.totalPrice}
        </h:column>

    </h:dataTable>

    <br/>

    <h:link outcome="searchOrder.xhtml"
            value="Search Another Order"/>

    |

    <h:link outcome="listOrders.xhtml"
            value="View Orders"/>

    <div class="nav-links">

        <h:link outcome="/default.xhtml"
                value="Back to Dashboard"/>

        |

        <h:form rendered="#{authBean.logged}"
                style="display:inline;">

            <h:commandLink value="Logout"
                           action="#{authBean.logout}"
                           styleClass="logout-btn"/>

        </h:form>

    </div>

</div>

</h:body>
</html>
