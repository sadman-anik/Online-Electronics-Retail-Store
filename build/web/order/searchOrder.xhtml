<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <h:outputStylesheet library="css" name="style.css"/><title>Search Order</title></h:head>
<h:body>
<div class="page-container">
<h1 class="page-header">Search for an Order</h1>
<div class="message"><h:messages globalOnly="false"/></div>

<h:form>
<h:panelGrid columns="2"><h:outputLabel value="Order #"/><h:inputText value="#{orderController.searchOrderId}"/></h:panelGrid>
<h:commandButton value="Search for an order" action="#{orderController.doSearchOrder}"/>
</h:form>
<h:link outcome="listOrders.xhtml" value="List of Orders"/>

<div class="nav-links">
<h:link outcome="/default.xhtml" value="Main Page"/> |
<h:commandLink value="Logout" action="#{authBean.logout}" rendered="#{authBean.logged}"/>
</div>
</div>
</h:body>
</html>
