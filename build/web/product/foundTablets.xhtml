<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Found Tablets</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">
        Found Tablets
    </h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>

    <h:dataTable value="#{productController.tabletList}"
                 var="t"
                 border="1"
                 style="width:100%;">

        <h:column>
            <f:facet name="header">ID</f:facet>
            #{t.id}
        </h:column>

        <h:column>
            <f:facet name="header">Brand</f:facet>
            #{t.brand}
        </h:column>

        <h:column>
            <f:facet name="header">Model</f:facet>
            #{t.model}
        </h:column>

        <h:column>
            <f:facet name="header">Display Size</f:facet>
            #{t.displaySize}
        </h:column>

        <h:column>
            <f:facet name="header">Operating System</f:facet>
            #{t.operatingSystem}
        </h:column>

        <h:column>
            <f:facet name="header">Price</f:facet>
            $#{t.price}
        </h:column>

        <h:column>
            <f:facet name="header">Stock</f:facet>
            #{t.stockNumber}
        </h:column>

        <h:column>
            <f:facet name="header">Storage</f:facet>
            #{t.storageCapacity}
        </h:column>

        <h:column>
            <f:facet name="header">Stylus Support</f:facet>
            #{t.stylusSupport}
        </h:column>

    </h:dataTable>

    <br/>

    <h:link outcome="searchTablet.xhtml"
            value="Search Again"/>

    |

    <h:link outcome="listTablets.xhtml"
            value="View Tablet Stock"/>

    <div class="nav-links">

        <h:link outcome="/default.xhtml"
                value="Back to Dashboard"/>

        |

        <h:form rendered="#{authBean.logged}"
                style="display:inline;">

            <h:commandLink value="Logout"
                           action="#{authBean.logout}"
                           styleClass="logout-btn"/>

        </h:form>

    </div>

</div>

</h:body>
</html>
