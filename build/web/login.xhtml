<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Login</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

<div class="page-container">

    <h1 class="page-header">Login Your Account</h1>

    <div class="message">
        <h:messages globalOnly="false"/>
    </div>

    <h:form>

        <h:panelGrid columns="2" cellpadding="8">

            <h:outputLabel value="Username" styleClass="required-label"/>
            <h:inputText value="#{authBean.username}"
                         required="true"
                         requiredMessage="Username is required."
                         autocomplete="off"/>

            <h:outputLabel value="Password" styleClass="required-label"/>
            <h:inputSecret value="#{authBean.password}"
                           required="true"
                           requiredMessage="Password is required."/>

        </h:panelGrid>

        <br/>

        <h:commandButton value="Login"
                         action="#{authBean.validateUser}"/>

    </h:form>

    <div class="nav-links">
        <h:link outcome="emailRecovery.xhtml"
                value="Forgot username or password?"/>
        <br/><br/>
        <h:link outcome="emailVerification.xhtml"
                value="Create New Account"/>
    </div>

</div>

</h:body>
</html>
